<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Đức Thuật Pro - Fake Timemark</title>
<!-- Leaflet CSS + JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Montserrat:wght@400;500;700;800&family=Roboto:wght@400;500;700&family=Bebas+Neue&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Ảnh nền trang */
body {
    font-family: 'Inter', sans-serif;
    background: url('https://i.postimg.cc/Bt1xMVQ8/IMG-2821.jpg') no-repeat center center fixed;
    background-size: cover;
    margin: 0;
    padding: 10px;
    position: relative;
}

/* Lớp phủ mờ để các điều khiển dễ đọc */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    pointer-events: none;
    z-index: 0;
}

.controls, .canvas-container, #map, .footer-logo {
    position: relative;
    z-index: 2;
}

.controls {
    background: rgba(30, 30, 30, 0.9);
    backdrop-filter: blur(8px);
    border-radius: 16px;
    padding: 20px;
    max-width: 900px;
    margin: 0 auto 15px;
    border: 1px solid #f5b400;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
    justify-content: center;
    align-items: center;
}

label {
    color: #f5b400;
    font-weight: bold;
    font-size: 14px;
    min-width: 120px;
    text-align: left;
}

input, textarea, select, button {
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: white;
    font-size: 14px;
    outline: none;
}

textarea {
    width: 100%;
    border-color: #f5b400;
    min-height: 60px;
    font-family: 'Inter', sans-serif;
}

button {
    background: #f5b400;
    color: #000;
    font-weight: 900;
    border: none;
    cursor: pointer;
    transition: 0.3s;
}

button:active {
    transform: scale(0.95);
}

.slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #252525cc;
    padding: 10px 15px;
    border-radius: 30px;
    margin: 8px 0;
}

.slider-row input {
    flex: 1;
    accent-color: #f5b400;
}

.checkbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #252525cc;
    padding: 10px 15px;
    border-radius: 30px;
    margin: 8px 0;
}

.checkbox-row label {
    min-width: auto;
}

.color-row {
    display: flex;
    align-items: center;
    gap: 15px;
    background: #252525cc;
    padding: 10px 15px;
    border-radius: 30px;
    margin: 8px 0;
}

.canvas-container {
    position: relative;
    display: inline-block;
    max-width: 100%;
    margin-top: 10px;
    background: rgba(0,0,0,0.5);
    border-radius: 8px;
    padding: 8px;
}

canvas {
    max-width: 100%;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    touch-action: none;
    cursor: grab;
    display: block;
    margin: 0 auto;
}

canvas:active {
    cursor: grabbing;
}

.scroll-top-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: #f5b400;
    color: #000;
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}

.scroll-top-btn:active {
    transform: scale(0.9);
}

#map {
    height: 300px;
    width: 100%;
    border-radius: 12px;
    margin-top: 15px;
    border: 1px solid #f5b400;
}

.map-controls {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    justify-content: flex-end;
}

.map-controls button {
    background: #0288d1;
    color: white;
    padding: 8px 16px;
    font-size: 14px;
}

#status {
    color: #f5b400;
    font-size: 13px;
    margin-top: 10px;
}

/* Logo cố định cuối trang */
.footer-logo {
    text-align: center;
    margin: 30px auto 0;
    padding: 20px;
    background: rgba(0,0,0,0.6);
    border-radius: 16px;
    max-width: 900px;
    backdrop-filter: blur(4px);
    border: 1px solid #f5b400;
}
.footer-logo-display {
    margin-top: 10px;
    min-height: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.footer-logo-display img {
    max-width: 100%;
    max-height: 120px;
    object-fit: contain;
}
</style>
</head>

<script>
(function(){
// ------------------- CÁC BIẾN CHÍNH -------------------
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let img = null;
let isLoaded = false;
let scale = 1;

let leftBlockX = 24;
let leftBlockY = 0;
let dragging = false;
let dragOffsetX = 0, dragOffsetY = 0;

let gpsText = "";

// Thời gian
let currentTime = new Date();
let staticTimeEnabled = false;
let staticDateStr = "18/03/2026";
let staticHour = 12, staticMinute = 0, staticSecond = 0;

// Long press
let longPressTimer = null;
const LONG_PRESS_DELAY = 600;
let isLongPressTriggered = false;

// Bản đồ
let map;
let currentMarker = null;

// Helper: fetch với timeout
function fetchWithTimeout(url, options, timeout = 10000) {
    return Promise.race([
        fetch(url, options),
        new Promise((_, reject) =>
            setTimeout(() => reject(new Error('Request timeout')), timeout)
        )
    ]);
}

// Hàm reverse geocoding dùng chung
async function reverseGeocode(lat, lng) {
    const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`;
    const userAgent = navigator.userAgent;
    try {
        const response = await fetchWithTimeout(url, {
            headers: { 'User-Agent': userAgent }
        }, 8000);
        const data = await response.json();
        if (data && data.display_name) {
            return data.display_name;
        } else {
            throw new Error('No display_name');
        }
    } catch (err) {
        console.warn('Reverse geocoding error:', err);
        return null;
    }
}

// Hàm cập nhật bản đồ và lấy địa chỉ
async function updateMapLocation(lat, lng) {
    if (!map) return;
    map.setView([lat, lng], 15);
    if (currentMarker) map.removeLayer(currentMarker);
    currentMarker = L.marker([lat, lng]).addTo(map).bindPopup(`Tọa độ: ${lat}, ${lng}`).openPopup();

    const address = await reverseGeocode(lat, lng);
    if (address) {
        const wrapped = wrapAddress(address, getMaxLineLength());
        document.getElementById('address').value = wrapped;
        document.getElementById('status').innerHTML = `📍 Đã cập nhật: ${address}`;
    } else {
        document.getElementById('status').innerHTML = `📍 Đã chọn tọa độ: ${lat}, ${lng} (không lấy được địa chỉ)`;
    }
    if (isLoaded) draw();
}

// ------------------- HÀM THỜI GIAN -------------------
function updateCurrentTime() {
    if (staticTimeEnabled) {
        let parts = staticDateStr.split('/');
        if (parts.length === 3) {
            let day = parseInt(parts[0]);
            let month = parseInt(parts[1]) - 1;
            let year = parseInt(parts[2]);
            currentTime = new Date(year, month, day, staticHour, staticMinute, staticSecond);
        } else {
            currentTime = new Date();
        }
    } else {
        currentTime = new Date();
    }
    if (isLoaded) draw();
}
setInterval(() => {
    if (!staticTimeEnabled) {
        currentTime = new Date();
        if (isLoaded) draw();
    }
}, 1000);

document.getElementById('useStaticTime').addEventListener('change', function(e) {
    staticTimeEnabled = e.target.checked;
    document.getElementById('staticTimeRow').style.display = staticTimeEnabled ? 'flex' : 'none';
    updateCurrentTime();
});
document.getElementById('staticDate').addEventListener('input', function() { staticDateStr = this.value; updateCurrentTime(); });
document.getElementById('staticHour').addEventListener('input', function() { staticHour = parseInt(this.value) || 0; updateCurrentTime(); });
document.getElementById('staticMinute').addEventListener('input', function() { staticMinute = parseInt(this.value) || 0; updateCurrentTime(); });
document.getElementById('staticSecond').addEventListener('input', function() { staticSecond = parseInt(this.value) || 0; updateCurrentTime(); });
window.setStaticToCurrentTime = function() {
    const now = new Date();
    const day = String(now.getDate()).padStart(2,'0');
    const month = String(now.getMonth()+1).padStart(2,'0');
    const year = now.getFullYear();
    document.getElementById('staticDate').value = `${day}/${month}/${year}`;
    document.getElementById('staticHour').value = now.getHours();
    document.getElementById('staticMinute').value = now.getMinutes();
    document.getElementById('staticSecond').value = now.getSeconds();
    const cb = document.getElementById('useStaticTime');
    if (!cb.checked) { cb.checked = true; staticTimeEnabled = true; document.getElementById('staticTimeRow').style.display = 'flex'; }
    updateCurrentTime();
    document.getElementById('status').innerText = 'Đã lấy giờ hiện tại vào thời gian tĩnh.';
};

// ------------------- XỬ LÝ ĐỊA CHỈ & TỌA ĐỘ -------------------
window.applyManualCoord = function() {
    const coord = document.getElementById('manualCoord').value.trim();
    if (coord) {
        gpsText = coord;
        document.getElementById('status').innerText = "Đã đặt GPS: " + coord;
        if (isLoaded) draw();
    }
};
document.getElementById('manualCoord').addEventListener('blur', function() { applyManualCoord(); });

// Wrap địa chỉ
function getMaxLineLength() { return parseInt(document.getElementById('maxLineLength').value); }
function wrapAddress(text, maxLen) {
    if (text.length <= maxLen) return text;
    let lines = [];
    let segments = text.split(/,\s*/);
    let currentLine = '';
    for (let seg of segments) {
        if (currentLine.length + seg.length + 2 <= maxLen) {
            if (currentLine) currentLine += ', ' + seg;
            else currentLine = seg;
        } else {
            if (currentLine) lines.push(currentLine);
            if (seg.length > maxLen) {
                let start = 0;
                while (start < seg.length) { lines.push(seg.substr(start, maxLen)); start += maxLen; }
                currentLine = '';
            } else { currentLine = seg; }
        }
    }
    if (currentLine) lines.push(currentLine);
    if (lines.length === 0) { for (let i = 0; i < text.length; i += maxLen) lines.push(text.substr(i, maxLen)); }
    return lines.join(',\n');
}
function autoWrapAddress() {
    const addrElem = document.getElementById('address');
    const raw = addrElem.value;
    const maxLen = getMaxLineLength();
    const lines = raw.split('\n');
    if (lines.length < 2 || lines[0].length > maxLen || lines[1]?.length > maxLen) {
        const wrapped = wrapAddress(raw.replace(/\n/g, ', '), maxLen);
        if (wrapped !== raw) { addrElem.value = wrapped; return true; }
    }
    return false;
}
document.getElementById('address').addEventListener('paste', function(e) { setTimeout(() => { if (autoWrapAddress() && isLoaded) draw(); }, 10); });
document.getElementById('address').addEventListener('blur', function() { if (autoWrapAddress() && isLoaded) draw(); });
document.getElementById('maxLineLength').addEventListener('input', function() { if (isLoaded) { autoWrapAddress(); draw(); } });

// Lấy GPS trình duyệt (nút bên ngoài)
window.getCurrentPosition = function() {
    if (!navigator.geolocation) { alert("Trình duyệt không hỗ trợ GPS."); return; }
    navigator.geolocation.getCurrentPosition(
        (pos) => { 
            const lat = pos.coords.latitude.toFixed(6); 
            const lng = pos.coords.longitude.toFixed(6); 
            gpsText = `${lat}, ${lng}`; 
            document.getElementById('manualCoord').value = gpsText; 
            document.getElementById('status').innerText = "Đã lấy GPS: " + gpsText; 
            if (isLoaded) draw();
            if (map) updateMapLocation(lat, lng);
        },
        (err) => { alert("Không thể lấy vị trí: " + err.message); }
    );
};

// Nút Vị trí hiện tại trên bản đồ
window.getCurrentLocationOnMap = function() {
    if (!navigator.geolocation) { alert("Trình duyệt không hỗ trợ GPS."); return; }
    navigator.geolocation.getCurrentPosition(
        (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            updateMapLocation(lat, lng);
            const coordText = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            document.getElementById('manualCoord').value = coordText;
            gpsText = coordText;
            if (isLoaded) draw();
        },
        (err) => { alert("Không thể lấy vị trí: " + err.message); }
    );
};

// Tìm kiếm địa chỉ (Nominatim)
window.searchMap = async function() {
    const address = document.getElementById('mapSearch').value;
    if (!address) return;
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`;
    const userAgent = navigator.userAgent;
    try {
        const response = await fetchWithTimeout(url, { headers: { 'User-Agent': userAgent } }, 8000);
        const data = await response.json();
        if (data && data.length > 0) {
            const result = data[0];
            const lat = parseFloat(result.lat).toFixed(6);
            const lng = parseFloat(result.lon).toFixed(6);
            const latLng = `${lat}, ${lng}`;
            gpsText = latLng;
            document.getElementById('manualCoord').value = latLng;
            const displayName = result.display_name;
            const maxLen = getMaxLineLength();
            const wrappedAddress = wrapAddress(displayName, maxLen);
            document.getElementById('address').value = wrappedAddress;
            document.getElementById('status').innerText = "Đã tìm thấy: " + displayName;
            if (isLoaded) draw();
            if (map) updateMapLocation(lat, lng);
        } else { alert('Không tìm thấy địa điểm nào.'); }
    } catch (err) {
        alert('Lỗi kết nối đến Nominatim: ' + err.message);
    }
};

// ------------------- BẢN ĐỒ OSM -------------------
function initMap() {
    map = L.map('map').setView([12.238791, 109.196749], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    map.on('click', async function(e) {
        const lat = e.latlng.lat.toFixed(6);
        const lng = e.latlng.lng.toFixed(6);
        const coordText = `${lat}, ${lng}`;
        document.getElementById('manualCoord').value = coordText;
        gpsText = coordText;
        if (currentMarker) map.removeLayer(currentMarker);
        currentMarker = L.marker([lat, lng]).addTo(map).bindPopup(`Tọa độ: ${coordText}`).openPopup();
        
        const address = await reverseGeocode(lat, lng);
        if (address) {
            const wrapped = wrapAddress(address, getMaxLineLength());
            document.getElementById('address').value = wrapped;
            document.getElementById('status').innerHTML = `📍 Đã chọn: ${address}`;
        } else {
            document.getElementById('status').innerHTML = `📍 Đã chọn tọa độ: ${coordText} (không lấy được địa chỉ)`;
        }
        if (isLoaded) draw();
    });
}

document.getElementById('upload').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')) { alert("Vui lòng chọn file ảnh!"); return; }
    const reader = new FileReader();
    reader.onload = ev=>{
        img = new Image();
        img.onload = ()=>{
            setupCanvas();
            loadSettingsAndDraw();
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
});
function setupCanvas(){
    if(!img) return;
    const maxSize = 2048;
    if(img.width>maxSize || img.height>maxSize){
        const ratio = Math.min(maxSize/img.width, maxSize/img.height);
        canvas.width = img.width*ratio;
        canvas.height = img.height*ratio;
    } else {
        canvas.width = img.width;
        canvas.height = img.height;
    }
    scale = canvas.width / 1080;
    isLoaded = true;
}

// ------------------- VẼ CANVAS -------------------
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!isLoaded || !img) {
        ctx.fillStyle = '#222';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f5b400';
        ctx.font = 'bold 20px Inter';
        ctx.fillText('Chưa có ảnh', 20, 50);
        return;
    }
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const fontFamily = document.getElementById('fontSelect').value;
    const timeFontFamily = document.getElementById('timeFontSelect').value;
    const fontWeight = document.getElementById('fontWeight').value;
    const fontItalic = document.getElementById('fontItalic').checked;
    const timeFontWeight = document.getElementById('timeFontWeight').value;
    const timeFontItalic = document.getElementById('timeFontItalic').checked;
    const logoFontWeight = document.getElementById('logoFontWeight').value;
    const logoFontItalic = document.getElementById('logoFontItalic').checked;
    const leftScale = parseFloat(document.getElementById('leftScale').value);
    const bottomScale = parseFloat(document.getElementById('bottomScale').value);
    const timeScale = parseFloat(document.getElementById('timeScale').value);
    const dateScale = parseFloat(document.getElementById('dateScale').value);
    const dayScale = parseFloat(document.getElementById('dayScale').value);
    const rightScale = parseFloat(document.getElementById('rightScale').value);
    const barWidthVal = parseFloat(document.getElementById('barWidth').value);
    const barHeightFactor = parseFloat(document.getElementById('barHeight').value);
    const addrMarginTop = parseFloat(document.getElementById('addrMargin').value) * scale;
    const swapLogo = document.getElementById('swapLogoColor').checked;
    const customLogo = document.getElementById('logoText').value.trim();
    const logoColor1 = document.getElementById('logoColor1').value;
    const logoColor2 = document.getElementById('logoColor2').value;
    const addrColor = document.getElementById('addrColor').value;
    const textOpacity = parseFloat(document.getElementById('textOpacity').value);
    const shadowOpacity = parseFloat(document.getElementById('shadowOpacity').value);
    const shadowBlur = parseFloat(document.getElementById('shadowBlur').value);
    const verticalNote = document.getElementById('verticalNote').value.trim();
    const noteFontSize = parseFloat(document.getElementById('noteFontSize').value) * scale;
    const notePadding = parseFloat(document.getElementById('notePadding').value) * scale;
    const timeFontSize = 100 * scale * timeScale;
    const dateFontSize = 30 * scale * dateScale;
    const dayFontSize = 26 * scale * dayScale;
    const addrFontSizeTop = 24 * scale * leftScale;
    const addrFontSizeBottom = 24 * scale * bottomScale;
    const logoFontSize = 28 * scale * rightScale;
    const subFontSize = 20 * scale * rightScale;
    const timeColor = '#FFFFFF';
    const dateColor = '#FFFFFF';
    const dayColor = '#E6FFFFFF';
    const subColor = '#CCFFFFFF';
    const barColor = '#FFC107';
    const fontStyle = fontItalic ? 'italic ' : '';
    const timeFontStyle = timeFontItalic ? 'italic ' : '';
    const logoFontStyle = logoFontItalic ? 'italic ' : '';
    const timeFont = `${timeFontStyle}${timeFontWeight} ${timeFontSize}px ${timeFontFamily}`;
    const dateFont = `${fontStyle}${fontWeight} ${dateFontSize}px ${fontFamily}`;
    const dayFont = `${fontStyle}${fontWeight} ${dayFontSize}px ${fontFamily}`;
    const addrFontTop = `${fontStyle}${fontWeight} ${addrFontSizeTop}px ${fontFamily}`;
    const addrFontBottom = `${fontStyle}${fontWeight} ${addrFontSizeBottom}px ${fontFamily}`;
    const logoFont = `${logoFontStyle}${logoFontWeight} ${logoFontSize}px ${fontFamily}`;
    const subFont = `${fontStyle}${fontWeight} ${subFontSize}px ${fontFamily}`;
    const noteFont = `${fontStyle}${fontWeight} ${noteFontSize}px ${fontFamily}`;
    const timeStr = `${currentTime.getHours().toString().padStart(2,'0')}:${currentTime.getMinutes().toString().padStart(2,'0')}`;
    const d = currentTime;
    const dateStr = `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()}`;
    const weekday = d.toLocaleDateString('vi-VN', { weekday: 'long' });
    const dayStr = weekday;
    let addrRaw = document.getElementById('address').value.trim() || "Không có địa chỉ";
    let addrLines = addrRaw.split('\n').map(s => s.trim()).filter(s => s);
    if (addrLines.length > 2) { addrLines = addrLines.slice(0,2); addrLines[1] = addrLines[1] + '...'; }
    if (addrLines.length === 0) addrLines = [""];
    else if (addrLines.length === 1) addrLines = [addrLines[0], ""];
    const ascentRatio = 0.8;
    const descentRatio = 0.2;
    const timeAscent = timeFontSize * ascentRatio;
    const timeDescent = timeFontSize * descentRatio;
    const dateAscent = dateFontSize * ascentRatio;
    const dayDescent = dayFontSize * descentRatio;
    const bottomPadding = 24 * scale;
    if (leftBlockY === 0) leftBlockY = canvas.height - bottomPadding - timeFontSize - 150 * scale;
    leftBlockY = Math.min(Math.max(leftBlockY, 10*scale), canvas.height - 200*scale);
    const timeY = leftBlockY + timeAscent;
    const dateY = leftBlockY + dateAscent;
    const dayY = leftBlockY + timeFontSize - dayDescent;
    ctx.font = timeFont;
    const timeWidth = ctx.measureText(timeStr).width;
    const barMargin = 12 * scale;
    const barWidth = barWidthVal * scale;
    const barX = leftBlockX + timeWidth + barMargin;
    const barY = leftBlockY;
    const barHeight = timeFontSize * barHeightFactor;
    const rightColX = barX + barWidth + barMargin;
    ctx.shadowColor = `rgba(0,0,0,${shadowOpacity})`;
    ctx.shadowBlur = shadowBlur;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;
    function setFillStyleWithOpacity(hex, opacity) {
        let r = parseInt(hex.substring(1,3),16);
        let g = parseInt(hex.substring(3,5),16);
        let b = parseInt(hex.substring(5,7),16);
        return `rgba(${r},${g},${b},${opacity})`;
    }
    ctx.textBaseline = 'alphabetic';
    ctx.font = timeFont;
    ctx.fillStyle = setFillStyleWithOpacity(timeColor, textOpacity);
    ctx.fillText(timeStr, leftBlockX, timeY);
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = barColor;
    ctx.fillRect(barX, barY, barWidth, barHeight);
    ctx.shadowColor = `rgba(0,0,0,${shadowOpacity})`;
    ctx.font = dateFont;
    ctx.fillStyle = setFillStyleWithOpacity(dateColor, textOpacity);
    ctx.fillText(dateStr, rightColX, dateY);
    ctx.font = dayFont;
    ctx.fillStyle = setFillStyleWithOpacity(dayColor, textOpacity * 0.9);
    ctx.fillText(dayStr, rightColX, dayY);
    const addrY1 = dayY + dayDescent + addrMarginTop;
    ctx.font = addrFontTop;
    ctx.fillStyle = setFillStyleWithOpacity(addrColor, textOpacity * 0.85);
    ctx.fillText(addrLines[0], leftBlockX, addrY1);
    if (addrLines[1]) {
        const addrY2 = addrY1 + addrFontSizeTop + 4 * scale;
        ctx.font = addrFontBottom;
        ctx.fillText(addrLines[1], leftBlockX, addrY2);
    }
    if (customLogo) {
        const logoX = canvas.width - 24 * scale;
        const logoYBase = canvas.height - 24 * scale;
        const logoY = logoYBase - subFontSize * 1.2 - 4*scale;
        ctx.font = logoFont;
        ctx.textAlign = 'right';
        const lowerLogo = customLogo.toLowerCase();
        if (lowerLogo.startsWith('time')) {
            const timePart = customLogo.substring(0,4);
            const markPart = customLogo.substring(4);
            const markWidth = ctx.measureText(markPart).width;
            let col1 = logoColor1, col2 = logoColor2;
            if (swapLogo) [col1, col2] = [col2, col1];
            ctx.fillStyle = setFillStyleWithOpacity(col2, textOpacity);
            ctx.fillText(markPart, logoX, logoY);
            ctx.fillStyle = setFillStyleWithOpacity(col1, textOpacity);
            ctx.fillText(timePart, logoX - markWidth, logoY);
        } else {
            ctx.fillStyle = setFillStyleWithOpacity(logoColor1, textOpacity);
            ctx.fillText(customLogo, logoX, logoY);
        }
        ctx.font = subFont;
        ctx.fillStyle = setFillStyleWithOpacity(subColor, textOpacity * 0.8);
        ctx.fillText('100% Chân thực', logoX, logoYBase);
        ctx.textAlign = 'left';
    }
    const showGps = document.getElementById('showGpsCheckbox').checked;
    if (showGps && gpsText) {
        ctx.font = `400 ${20 * scale}px ${fontFamily}`;
        ctx.fillStyle = setFillStyleWithOpacity('#A0D8FF', textOpacity);
        ctx.fillText(gpsText, leftBlockX, canvas.height - 10*scale);
    }
    if (verticalNote) {
        const iconText = '🛡️✓ ';
        const fullText = iconText + verticalNote;
        ctx.save();
        ctx.font = noteFont;
        ctx.fillStyle = setFillStyleWithOpacity('#FFFFFF', textOpacity * 0.85);
        ctx.shadowColor = `rgba(0,0,0,${shadowOpacity})`;
        ctx.shadowBlur = shadowBlur;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;
        const centerX = canvas.width - notePadding;
        const centerY = canvas.height / 2;
        ctx.translate(centerX, centerY);
        ctx.rotate(-90 * Math.PI / 180);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(fullText, 0, 0);
        ctx.restore();
    }
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    document.getElementById('status').innerHTML = `Vị trí khối trái: (${Math.round(leftBlockX)}, ${Math.round(leftBlockY)}) | Kéo thả để di chuyển.`;
}

window.downloadImage = function(format) {
    if (!isLoaded) {
        alert("Chưa có ảnh để tải!");
        return;
    }
    const quality = parseInt(document.getElementById('jpegQuality').value) / 100;
    let mimeType = 'image/png';
    let extension = 'png';
    if (format === 'jpeg') {
        mimeType = 'image/jpeg';
        extension = 'jpg';
    }
    const dataURL = canvas.toDataURL(mimeType, quality);
    const link = document.createElement('a');
    link.download = `ducthuat_${new Date().getTime()}.${extension}`;
    link.href = dataURL;
    link.click();
};

// ------------------- KÉO THẢ & LONG PRESS -------------------
function handleDragStart(e) {
    e.preventDefault();
    if (!isLoaded) return;
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX ?? (e.touches ? e.touches[0].clientX : 0);
    const clientY = e.clientY ?? (e.touches ? e.touches[0].clientY : 0);
    const mouseX = (clientX - rect.left) * (canvas.width / rect.width);
    const mouseY = (clientY - rect.top) * (canvas.height / rect.height);
    dragging = true;
    dragOffsetX = mouseX - leftBlockX;
    dragOffsetY = mouseY - leftBlockY;
    canvas.style.cursor = 'grabbing';
}
function handleDragMove(e) {
    if (!dragging || !isLoaded) return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX ?? (e.touches ? e.touches[0].clientX : 0);
    const clientY = e.clientY ?? (e.touches ? e.touches[0].clientY : 0);
    const mouseX = (clientX - rect.left) * (canvas.width / rect.width);
    const mouseY = (clientY - rect.top) * (canvas.height / rect.height);
    let newX = mouseX - dragOffsetX;
    let newY = mouseY - dragOffsetY;
    newX = Math.min(Math.max(newX, 10*scale), canvas.width - 200*scale);
    newY = Math.min(Math.max(newY, 10*scale), canvas.height - 200*scale);
    leftBlockX = newX;
    leftBlockY = newY;
    draw();
}
function handleDragEnd(e) {
    if (dragging) { dragging = false; canvas.style.cursor = 'grab'; }
}
function onTouchStart(e) {
    e.preventDefault();
    if (!isLoaded) return;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const mouseX = (touch.clientX - rect.left) * (canvas.width / rect.width);
    const mouseY = (touch.clientY - rect.top) * (canvas.height / rect.height);
    dragOffsetX = mouseX - leftBlockX;
    dragOffsetY = mouseY - leftBlockY;
    isLongPressTriggered = false;
    if (longPressTimer) clearTimeout(longPressTimer);
    longPressTimer = setTimeout(() => { isLongPressTriggered = true; downloadImage('png'); }, LONG_PRESS_DELAY);
}
function onTouchMove(e) {
    if (!isLoaded) return;
    if (isLongPressTriggered) { e.preventDefault(); return; }
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    if (!dragging) { dragging = true; canvas.style.cursor = 'grabbing'; }
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const mouseX = (touch.clientX - rect.left) * (canvas.width / rect.width);
    const mouseY = (touch.clientY - rect.top) * (canvas.height / rect.height);
    let newX = mouseX - dragOffsetX;
    let newY = mouseY - dragOffsetY;
    newX = Math.min(Math.max(newX, 10*scale), canvas.width - 200*scale);
    newY = Math.min(Math.max(newY, 10*scale), canvas.height - 200*scale);
    leftBlockX = newX;
    leftBlockY = newY;
    draw();
}
function onTouchEnd(e) {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    if (isLongPressTriggered) { isLongPressTriggered = false; e.preventDefault(); return; }
    if (dragging) { dragging = false; canvas.style.cursor = 'grab'; }
}
function onTouchCancel(e) { onTouchEnd(e); }
