<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đức Thuật Pro - Tự động áp dụng tọa độ & xuống dòng</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Montserrat:wght@400;500;700;800&family=Roboto:wght@400;500;700&family=Bebas+Neue&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; background: #111; color: white; text-align: center; padding: 10px; margin: 0; }
.controls { background: #1e1e1e; border-radius: 16px; padding: 20px; max-width: 900px; margin: 0 auto 15px; border: 1px solid #333; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; justify-content: center; align-items: center; }
label { color: #f5b400; font-weight: bold; font-size: 14px; min-width: 120px; text-align: left; }
input, textarea, select, button { padding: 12px; border-radius: 12px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 14px; outline: none; }
textarea { width: 100%; border-color: #f5b400; min-height: 60px; font-family: 'Inter', sans-serif; }
button { background: #f5b400; color: #000; font-weight: 900; border: none; cursor: pointer; transition: 0.3s; }
button:active { transform: scale(0.95); }
.slider-row { display: flex; align-items: center; gap: 10px; background: #252525; padding: 10px 15px; border-radius: 30px; margin: 8px 0; }
.slider-row input { flex: 1; accent-color: #f5b400; }
.checkbox-row { display: flex; align-items: center; gap: 10px; background: #252525; padding: 10px 15px; border-radius: 30px; margin: 8px 0; }
.checkbox-row label { min-width: auto; }
.color-row { display: flex; align-items: center; gap: 15px; background: #252525; padding: 10px 15px; border-radius: 30px; margin: 8px 0; }
canvas { max-width: 100%; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); touch-action: none; margin-top: 10px; cursor: grab; }
canvas:active { cursor: grabbing; }
#status { color: #f5b400; font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>

<div class="controls">
<h3 style="margin:0 0 15px 0; color:#f5b400; letter-spacing: 1px;">TOOL ĐỨC THUẬT PRO (TỰ ĐỘNG ÁP DỤNG TỌA ĐỘ & XUỐNG DÒNG)</h3>

<div class="row">
    <label>📷 Chọn ảnh nền:</label>
    <input type="file" id="upload" accept="image/*" style="flex:1">
</div>

<div class="row">
    <textarea id="address" placeholder="Địa chỉ chi tiết (có thể xuống dòng)">X Ea Pô, H. Cư Jút, T. Đắk Nông</textarea>
</div>

<!-- Tìm kiếm địa chỉ (dùng Nominatim - không cần key) -->
<div class="row">
    <label>🔍 Tìm địa điểm:</label>
    <input type="text" id="mapSearch" style="flex:1" placeholder="Nhập địa chỉ...">
    <button onclick="searchMap()">Tìm</button>
</div>

<!-- Tọa độ thủ công (tự động áp dụng khi blur) -->
<div class="row">
    <label>📍 Tọa độ GPS:</label>
    <input type="text" id="manualCoord" value="" style="flex:1" placeholder="VD: 12.4519176, 107.6249466">
    <button onclick="applyManualCoord()" style="background:#0288d1;">Áp dụng (thủ công)</button>
</div>

<!-- Thời gian tĩnh -->
<div class="checkbox-row">
    <label>⏰ Dùng thời gian tĩnh:</label>
    <input type="checkbox" id="useStaticTime">
</div>
<div class="row" id="staticTimeRow" style="display: none;">
    <label>Ngày (DD/MM/YYYY):</label>
    <input type="text" id="staticDate" value="18/03/2026" style="width:120px">
    <label>Giờ:</label>
    <input type="number" id="staticHour" min="0" max="23" value="12" style="width:70px">
    <label>Phút:</label>
    <input type="number" id="staticMinute" min="0" max="59" value="0" style="width:70px">
    <label>Giây:</label>
    <input type="number" id="staticSecond" min="0" max="59" value="0" style="width:70px">
    <button onclick="setStaticToCurrentTime()" style="background:#ff9800;">📅 Lấy giờ hiện tại</button>
</div>

<!-- Logo text (mặc định Timemark) -->
<div class="row">
    <label>✏️ Logo text:</label>
    <input type="text" id="logoText" value="Timemark" style="flex:1" placeholder="Nhập logo text (để trống để ẩn)">
</div>

<!-- Màu sắc logo text -->
<div class="color-row">
    <label>🎨 Màu text phần 1:</label>
    <input type="color" id="logoColor1" value="#FFC107">
    <label>Màu text phần 2:</label>
    <input type="color" id="logoColor2" value="#FFFFFF">
    <label style="min-width:60px;">Đảo màu:</label>
    <input type="checkbox" id="swapLogoColor">
</div>

<!-- Ghi chú dọc (bên phải) -->
<div class="row">
    <label>📝 Ghi chú dọc (phải):</label>
    <input type="text" id="verticalNote" value="Chứng thực" style="flex:1" placeholder="Nhập nội dung (để trống nếu không muốn hiển thị)">
</div>

<!-- Font chữ và kiểu -->
<div class="row">
    <label>🔤 Font địa chỉ/ngày:</label>
    <select id="fontSelect" style="flex:1">
        <option value="Inter">Inter</option>
        <option value="Roboto">Roboto</option>
        <option value="Montserrat">Montserrat</option>
        <option value="Lato">Lato</option>
    </select>
</div>
<div class="row">
    <label>⚙️ Weight / Italic (địa chỉ/ngày/thứ/ghi chú):</label>
    <select id="fontWeight" style="width:80px">
        <option value="400" selected>400</option>
        <option value="500">500</option>
        <option value="600">600</option>
        <option value="700">700</option>
        <option value="800">800</option>
        <option value="900">900</option>
    </select>
    <label>Nghiêng:</label>
    <input type="checkbox" id="fontItalic">
</div>

<div class="row">
    <label>⏱️ Font giờ:</label>
    <select id="timeFontSelect" style="flex:1">
        <option value="Inter">Inter</option>
        <option value="Bebas Neue">Bebas Neue</option>
        <option value="Montserrat">Montserrat</option>
        <option value="Roboto">Roboto</option>
    </select>
</div>
<div class="row">
    <label>⚙️ Weight / Italic (giờ):</label>
    <select id="timeFontWeight" style="width:80px">
        <option value="400">400</option>
        <option value="500">500</option>
        <option value="600">600</option>
        <option value="700" selected>700</option>
        <option value="800">800</option>
        <option value="900">900</option>
    </select>
    <label>Nghiêng:</label>
    <input type="checkbox" id="timeFontItalic">
</div>

<div class="row">
    <label>⚙️ Weight / Italic (logo):</label>
    <select id="logoFontWeight" style="width:80px">
        <option value="400">400</option>
        <option value="500">500</option>
        <option value="600">600</option>
        <option value="700" selected>700</option>
        <option value="800">800</option>
        <option value="900">900</option>
    </select>
    <label>Nghiêng:</label>
    <input type="checkbox" id="logoFontItalic">
</div>

<!-- Các thanh trượt điều chỉnh -->
<div class="slider-row">
    <label>📏 Cỡ chữ trái (địa chỉ):</label>
    <input type="range" id="leftScale" min="0.7" max="1.5" value="1.0" step="0.01">
</div>
<div class="slider-row">
    <label>🔢 Cỡ giờ:</label>
    <input type="range" id="timeScale" min="0.5" max="2.0" value="1.0" step="0.01">
</div>
<div class="slider-row">
    <label>📅 Cỡ ngày:</label>
    <input type="range" id="dateScale" min="0.5" max="2.0" value="1.0" step="0.01">
</div>
<div class="slider-row">
    <label>📆 Cỡ thứ:</label>
    <input type="range" id="dayScale" min="0.5" max="2.0" value="1.0" step="0.01">
</div>
<div class="slider-row">
    <label>📏 Cỡ logo text:</label>
    <input type="range" id="rightScale" min="0.5" max="2.0" value="1.0" step="0.01">
</div>
<div class="slider-row">
    <label>🟨 Độ dày thanh vàng:</label>
    <input type="range" id="barWidth" min="1" max="10" value="4" step="0.5">
</div>
<div class="slider-row">
    <label>📐 Chiều cao thanh vàng (% giờ):</label>
    <input type="range" id="barHeight" min="0.5" max="1.5" value="1.0" step="0.01">
</div>
<div class="slider-row">
    <label>⬆️ Khoảng cách thứ → địa chỉ:</label>
    <input type="range" id="addrMargin" min="5" max="40" value="20" step="1">
</div>
<div class="slider-row">
    <label>🔆 Độ mờ text/ảnh chung:</label>
    <input type="range" id="textOpacity" min="0" max="1" value="1" step="0.01">
</div>
<div class="slider-row">
    <label>💡 Bóng - Độ mờ (alpha):</label>
    <input type="range" id="shadowOpacity" min="0" max="1" value="0.8" step="0.01">
</div>
<div class="slider-row">
    <label>💡 Bóng - Độ lớn (blur):</label>
    <input type="range" id="shadowBlur" min="0" max="20" value="8" step="0.5">
</div>
<div class="slider-row">
    <label>📏 Cỡ chữ ghi chú dọc:</label>
    <input type="range" id="noteFontSize" min="10" max="30" value="18" step="0.5">
</div>
<div class="slider-row">
    <label>📐 Padding ghi chú dọc (px):</label>
    <input type="range" id="notePadding" min="0" max="30" value="15" step="0.5">
</div>
<!-- THANH TRƯỢT MỚI: Max ký tự mỗi dòng cho địa chỉ -->
<div class="slider-row">
    <label>🔤 Max ký tự mỗi dòng:</label>
    <input type="range" id="maxLineLength" min="30" max="80" value="50" step="1">
</div>

<div class="row">
    <button onclick="getCurrentPosition()" style="flex:1">📍 LẤY GPS TRÌNH DUYỆT</button>
    <button onclick="downloadImage()" style="flex:1; background:#2e7d32; color:white;">📥 TẢI ẢNH VỀ</button>
    <button onclick="saveSettings()" style="flex:1; background:#0288d1; color:white;">💾 LƯU CÀI ĐẶT</button>
</div>

<div id="status">Sẵn sàng! Kéo thả khung chữ bên trái để di chuyển.</div>
</div>

<canvas id="canvas"></canvas>

<script>
(function(){
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let img = null;
let isLoaded = false;
let scale = 1;

let leftBlockX = 24;
let leftBlockY = 0;

let dragging = false;
let dragOffsetX = 0, dragOffsetY = 0;

let gpsText = "";

// Thời gian
let currentTime = new Date();
let staticTimeEnabled = false;
let staticDateStr = "18/03/2026";
let staticHour = 12, staticMinute = 0, staticSecond = 0;

function updateCurrentTime() {
    if (staticTimeEnabled) {
        let parts = staticDateStr.split('/');
        if (parts.length === 3) {
            let day = parseInt(parts[0]);
            let month = parseInt(parts[1]) - 1;
            let year = parseInt(parts[2]);
            currentTime = new Date(year, month, day, staticHour, staticMinute, staticSecond);
        } else {
            currentTime = new Date();
        }
    } else {
        currentTime = new Date();
    }
    if (isLoaded) draw();
}

setInterval(() => {
    if (!staticTimeEnabled) {
        currentTime = new Date();
        if (isLoaded) draw();
    }
}, 1000);

document.getElementById('useStaticTime').addEventListener('change', function(e) {
    staticTimeEnabled = e.target.checked;
    document.getElementById('staticTimeRow').style.display = staticTimeEnabled ? 'flex' : 'none';
    updateCurrentTime();
});

document.getElementById('staticDate').addEventListener('input', function() {
    staticDateStr = this.value;
    updateCurrentTime();
});
document.getElementById('staticHour').addEventListener('input', function() {
    staticHour = parseInt(this.value) || 0;
    updateCurrentTime();
});
document.getElementById('staticMinute').addEventListener('input', function() {
    staticMinute = parseInt(this.value) || 0;
    updateCurrentTime();
});
document.getElementById('staticSecond').addEventListener('input', function() {
    staticSecond = parseInt(this.value) || 0;
    updateCurrentTime();
});

// Hàm lấy giờ hiện tại và đặt vào thời gian tĩnh
window.setStaticToCurrentTime = function() {
    const now = new Date();
    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const year = now.getFullYear();
    document.getElementById('staticDate').value = `${day}/${month}/${year}`;
    document.getElementById('staticHour').value = now.getHours();
    document.getElementById('staticMinute').value = now.getMinutes();
    document.getElementById('staticSecond').value = now.getSeconds();
    // Bật checkbox dùng thời gian tĩnh
    const cb = document.getElementById('useStaticTime');
    if (!cb.checked) {
        cb.checked = true;
        staticTimeEnabled = true;
        document.getElementById('staticTimeRow').style.display = 'flex';
    }
    updateCurrentTime();
    document.getElementById('status').innerText = 'Đã lấy giờ hiện tại vào thời gian tĩnh.';
};

// Áp dụng tọa độ thủ công
window.applyManualCoord = function() {
    const coord = document.getElementById('manualCoord').value.trim();
    if (coord) {
        gpsText = coord;
        document.getElementById('status').innerText = "Đã đặt GPS: " + coord;
        if (isLoaded) draw();
    }
};

// Tự động áp dụng tọa độ khi rời khỏi ô input
document.getElementById('manualCoord').addEventListener('blur', function() {
    applyManualCoord();
});

// ===== CẢI TIẾN TỰ ĐỘNG XUỐNG DÒNG =====
// Lấy giá trị max ký tự từ thanh trượt
function getMaxLineLength() {
    return parseInt(document.getElementById('maxLineLength').value);
}

// Hàm wrap địa chỉ thông minh (ưu tiên ngắt sau dấu phẩy)
function wrapAddress(text, maxLen) {
    if (text.length <= maxLen) return text;
    let lines = [];
    // Thử tách theo dấu phẩy + khoảng trắng
    let segments = text.split(/,\s*/);
    let currentLine = '';
    for (let seg of segments) {
        if (currentLine.length + seg.length + 2 <= maxLen) { // +2 cho dấu phẩy và khoảng trắng
            if (currentLine) currentLine += ', ' + seg;
            else currentLine = seg;
        } else {
            if (currentLine) lines.push(currentLine);
            // Nếu bản thân seg đã dài quá maxLen, phải cắt cứng
            if (seg.length > maxLen) {
                // Cắt seg thành nhiều đoạn
                let start = 0;
                while (start < seg.length) {
                    lines.push(seg.substr(start, maxLen));
                    start += maxLen;
                }
                currentLine = '';
            } else {
                currentLine = seg;
            }
        }
    }
    if (currentLine) lines.push(currentLine);
    // Nếu không có dấu phẩy, fallback: cắt cứng theo maxLen
    if (lines.length === 0) {
        for (let i = 0; i < text.length; i += maxLen) {
            lines.push(text.substr(i, maxLen));
        }
    }
    return lines.join(',\n');
}

// Hàm tự động wrap địa chỉ (gọi khi cần)
function autoWrapAddress() {
    const addrElem = document.getElementById('address');
    const raw = addrElem.value;
    const maxLen = getMaxLineLength();
    // Chỉ wrap nếu có ít hơn 2 dòng hoặc dòng đầu quá dài
    const lines = raw.split('\n');
    if (lines.length < 2 || lines[0].length > maxLen || lines[1]?.length > maxLen) {
        const wrapped = wrapAddress(raw.replace(/\n/g, ', '), maxLen);
        if (wrapped !== raw) {
            addrElem.value = wrapped;
            return true; // đã thay đổi
        }
    }
    return false;
}

// Tự động wrap sau khi dán
document.getElementById('address').addEventListener('paste', function(e) {
    setTimeout(() => {
        if (autoWrapAddress() && isLoaded) draw();
    }, 10);
});

// Tự động wrap khi rời khỏi ô (blur) - giữ nguyên
document.getElementById('address').addEventListener('blur', function() {
    if (autoWrapAddress() && isLoaded) draw();
});

// Nếu thay đổi thanh trượt maxLineLength, có thể wrap lại (tuỳ chọn)
document.getElementById('maxLineLength').addEventListener('input', function() {
    if (isLoaded) {
        autoWrapAddress();
        draw();
    }
});

// Kết thúc cải tiến xuống dòng

window.getCurrentPosition = function() {
    if (!navigator.geolocation) {
        alert("Trình duyệt không hỗ trợ GPS.");
        return;
    }
    navigator.geolocation.getCurrentPosition(
        (pos) => {
            const lat = pos.coords.latitude.toFixed(6);
            const lng = pos.coords.longitude.toFixed(6);
            gpsText = `${lat}, ${lng}`;
            document.getElementById('manualCoord').value = gpsText;
            document.getElementById('status').innerText = "Đã lấy GPS: " + gpsText;
            if (isLoaded) draw();
        },
        (err) => {
            alert("Không thể lấy vị trí: " + err.message);
        }
    );
};

// Tìm kiếm địa điểm bằng Nominatim (OpenStreetMap) - không cần API key
window.searchMap = function() {
    const address = document.getElementById('mapSearch').value;
    if (!address) return;
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`;
    fetch(url, {
        headers: {
            'User-Agent': 'DucThuatTool/1.0 (your-email@example.com)' // Thay bằng email của bạn nếu có
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data && data.length > 0) {
            const result = data[0];
            const lat = parseFloat(result.lat).toFixed(6);
            const lng = parseFloat(result.lon).toFixed(6);
            const latLng = `${lat}, ${lng}`;
            gpsText = latLng;
            document.getElementById('manualCoord').value = latLng;
            // Lấy địa chỉ dạng hiển thị (display_name) và wrap
            const displayName = result.display_name;
            const maxLen = getMaxLineLength();
            const wrappedAddress = wrapAddress(displayName, maxLen);
            document.getElementById('address').value = wrappedAddress;
            document.getElementById('status').innerText = "Đã tìm thấy: " + displayName;
            if (isLoaded) draw();
        } else {
            alert('Không tìm thấy địa điểm nào.');
        }
    })
    .catch(err => {
        alert('Lỗi kết nối đến Nominatim: ' + err.message);
    });
};

// Tải ảnh nền
document.getElementById('upload').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')) { alert("Vui lòng chọn file ảnh!"); return; }
    const reader = new FileReader();
    reader.onload = ev=>{
        img = new Image();
        img.onload = ()=>{
            setupCanvas();
            loadSettingsAndDraw();
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
});

function setupCanvas(){
    if(!img) return;
    const maxSize = 2048;
    if(img.width>maxSize || img.height>maxSize){
        const ratio = Math.min(maxSize/img.width, maxSize/img.height);
        canvas.width = img.width*ratio;
        canvas.height = img.height*ratio;
    } else {
        canvas.width = img.width;
        canvas.height = img.height;
    }
    scale = canvas.width / 1080;
    isLoaded = true;
}

// Lưu cài đặt
window.saveSettings = function() {
    const settings = {
        address: document.getElementById('address').value,
        manualCoord: document.getElementById('manualCoord').value,
        useStaticTime: document.getElementById('useStaticTime').checked,
        staticDate: document.getElementById('staticDate').value,
        staticHour: document.getElementById('staticHour').value,
        staticMinute: document.getElementById('staticMinute').value,
        staticSecond: document.getElementById('staticSecond').value,
        fontSelect: document.getElementById('fontSelect').value,
        timeFontSelect: document.getElementById('timeFontSelect').value,
        fontWeight: document.getElementById('fontWeight').value,
        fontItalic: document.getElementById('fontItalic').checked,
        timeFontWeight: document.getElementById('timeFontWeight').value,
        timeFontItalic: document.getElementById('timeFontItalic').checked,
        logoFontWeight: document.getElementById('logoFontWeight').value,
        logoFontItalic: document.getElementById('logoFontItalic').checked,
        logoText: document.getElementById('logoText').value,
        logoColor1: document.getElementById('logoColor1').value,
        logoColor2: document.getElementById('logoColor2').value,
        swapLogoColor: document.getElementById('swapLogoColor').checked,
        leftScale: parseFloat(document.getElementById('leftScale').value),
        timeScale: parseFloat(document.getElementById('timeScale').value),
        dateScale: parseFloat(document.getElementById('dateScale').value),
        dayScale: parseFloat(document.getElementById('dayScale').value),
        rightScale: parseFloat(document.getElementById('rightScale').value),
        barWidth: parseFloat(document.getElementById('barWidth').value),
        barHeight: parseFloat(document.getElementById('barHeight').value),
        addrMargin: parseFloat(document.getElementById('addrMargin').value),
        textOpacity: parseFloat(document.getElementById('textOpacity').value),
        shadowOpacity: parseFloat(document.getElementById('shadowOpacity').value),
        shadowBlur: parseFloat(document.getElementById('shadowBlur').value),
        verticalNote: document.getElementById('verticalNote').value,
        noteFontSize: parseFloat(document.getElementById('noteFontSize').value),
        notePadding: parseFloat(document.getElementById('notePadding').value),
        maxLineLength: parseInt(document.getElementById('maxLineLength').value), // lưu thêm
        leftBlockXDp: leftBlockX / scale,
        leftBlockYDp: leftBlockY / scale,
        gpsText: gpsText,
    };
    localStorage.setItem('ducThuậtSettings', JSON.stringify(settings));
    document.getElementById('status').innerText = '✅ Đã lưu cài đặt!';
};

// Tải cài đặt
function loadSettingsAndDraw() {
    const saved = localStorage.getItem('ducThuậtSettings');
    if (!saved) return;

    try {
        const s = JSON.parse(saved);
        if (s.address !== undefined) document.getElementById('address').value = s.address;
        if (s.manualCoord !== undefined) document.getElementById('manualCoord').value = s.manualCoord;
        if (s.useStaticTime !== undefined) {
            document.getElementById('useStaticTime').checked = s.useStaticTime;
            staticTimeEnabled = s.useStaticTime;
            document.getElementById('staticTimeRow').style.display = staticTimeEnabled ? 'flex' : 'none';
        }
        if (s.staticDate) document.getElementById('staticDate').value = s.staticDate;
        if (s.staticHour !== undefined) document.getElementById('staticHour').value = s.staticHour;
        if (s.staticMinute !== undefined) document.getElementById('staticMinute').value = s.staticMinute;
        if (s.staticSecond !== undefined) document.getElementById('staticSecond').value = s.staticSecond;
        if (s.fontSelect) document.getElementById('fontSelect').value = s.fontSelect;
        if (s.timeFontSelect) document.getElementById('timeFontSelect').value = s.timeFontSelect;
        if (s.fontWeight) document.getElementById('fontWeight').value = s.fontWeight;
        if (s.fontItalic !== undefined) document.getElementById('fontItalic').checked = s.fontItalic;
        if (s.timeFontWeight) document.getElementById('timeFontWeight').value = s.timeFontWeight;
        if (s.timeFontItalic !== undefined) document.getElementById('timeFontItalic').checked = s.timeFontItalic;
        if (s.logoFontWeight) document.getElementById('logoFontWeight').value = s.logoFontWeight;
        if (s.logoFontItalic !== undefined) document.getElementById('logoFontItalic').checked = s.logoFontItalic;
        if (s.logoText !== undefined) document.getElementById('logoText').value = s.logoText;
        if (s.logoColor1) document.getElementById('logoColor1').value = s.logoColor1;
        if (s.logoColor2) document.getElementById('logoColor2').value = s.logoColor2;
        document.getElementById('swapLogoColor').checked = !!s.swapLogoColor;
        if (s.leftScale !== undefined) document.getElementById('leftScale').value = s.leftScale;
        if (s.timeScale !== undefined) document.getElementById('timeScale').value = s.timeScale;
        if (s.dateScale !== undefined) document.getElementById('dateScale').value = s.dateScale;
        if (s.dayScale !== undefined) document.getElementById('dayScale').value = s.dayScale;
        if (s.rightScale !== undefined) document.getElementById('rightScale').value = s.rightScale;
        if (s.barWidth !== undefined) document.getElementById('barWidth').value = s.barWidth;
        if (s.barHeight !== undefined) document.getElementById('barHeight').value = s.barHeight;
        if (s.addrMargin !== undefined) document.getElementById('addrMargin').value = s.addrMargin;
        if (s.textOpacity !== undefined) document.getElementById('textOpacity').value = s.textOpacity;
        if (s.shadowOpacity !== undefined) document.getElementById('shadowOpacity').value = s.shadowOpacity;
        if (s.shadowBlur !== undefined) document.getElementById('shadowBlur').value = s.shadowBlur;
        if (s.verticalNote !== undefined) document.getElementById('verticalNote').value = s.verticalNote;
        if (s.noteFontSize !== undefined) document.getElementById('noteFontSize').value = s.noteFontSize;
        if (s.notePadding !== undefined) document.getElementById('notePadding').value = s.notePadding;
        if (s.maxLineLength !== undefined) document.getElementById('maxLineLength').value = s.maxLineLength; // khôi phục
        if (s.gpsText) gpsText = s.gpsText;

        if (isLoaded && s.leftBlockXDp !== undefined && s.leftBlockYDp !== undefined) {
            leftBlockX = s.leftBlockXDp * scale;
            leftBlockY = s.leftBlockYDp * scale;
        }

        updateCurrentTime();
        draw();
        document.getElementById('status').innerText = '🔄 Đã tải cài đặt!';
    } catch (e) {
        console.warn("Lỗi đọc settings", e);
    }
}

// Vẽ
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!isLoaded || !img) {
        ctx.fillStyle = '#222';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f5b400';
        ctx.font = 'bold 20px Inter';
        ctx.fillText('Chưa có ảnh', 20, 50);
        return;
    }

    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    const fontFamily = document.getElementById('fontSelect').value;
    const timeFontFamily = document.getElementById('timeFontSelect').value;
    const fontWeight = document.getElementById('fontWeight').value;
    const fontItalic = document.getElementById('fontItalic').checked;
    const timeFontWeight = document.getElementById('timeFontWeight').value;
    const timeFontItalic = document.getElementById('timeFontItalic').checked;
    const logoFontWeight = document.getElementById('logoFontWeight').value;
    const logoFontItalic = document.getElementById('logoFontItalic').checked;

    const leftScale = parseFloat(document.getElementById('leftScale').value);
    const timeScale = parseFloat(document.getElementById('timeScale').value);
    const dateScale = parseFloat(document.getElementById('dateScale').value);
    const dayScale = parseFloat(document.getElementById('dayScale').value);
    const rightScale = parseFloat(document.getElementById('rightScale').value);
    const barWidthVal = parseFloat(document.getElementById('barWidth').value);
    const barHeightFactor = parseFloat(document.getElementById('barHeight').value);
    const addrMarginTop = parseFloat(document.getElementById('addrMargin').value) * scale;
    const swapLogo = document.getElementById('swapLogoColor').checked;
    const customLogo = document.getElementById('logoText').value.trim(); // có thể rỗng
    const logoColor1 = document.getElementById('logoColor1').value;
    const logoColor2 = document.getElementById('logoColor2').value;

    const textOpacity = parseFloat(document.getElementById('textOpacity').value);
    const shadowOpacity = parseFloat(document.getElementById('shadowOpacity').value);
    const shadowBlur = parseFloat(document.getElementById('shadowBlur').value);

    const verticalNote = document.getElementById('verticalNote').value.trim();
    const noteFontSize = parseFloat(document.getElementById('noteFontSize').value) * scale;
    const notePadding = parseFloat(document.getElementById('notePadding').value) * scale;

    const timeFontSize = 100 * scale * timeScale;
    const dateFontSize = 30 * scale * dateScale;
    const dayFontSize = 26 * scale * dayScale;
    const addrFontSize = 24 * scale * leftScale;
    const logoFontSize = 28 * scale * rightScale;
    const subFontSize = 20 * scale * rightScale;

    const timeColor = '#FFFFFF';
    const dateColor = '#FFFFFF';
    const dayColor = '#E6FFFFFF';
    const addrColor = '#D9FFFFFF';
    const subColor = '#CCFFFFFF';
    const barColor = '#FFC107';

    // Tạo style string cho font (italic nếu có)
    const fontStyle = fontItalic ? 'italic ' : '';
    const timeFontStyle = timeFontItalic ? 'italic ' : '';
    const logoFontStyle = logoFontItalic ? 'italic ' : '';

    const timeFont = `${timeFontStyle}${timeFontWeight} ${timeFontSize}px ${timeFontFamily}`;
    const dateFont = `${fontStyle}${fontWeight} ${dateFontSize}px ${fontFamily}`;
    const dayFont = `${fontStyle}${fontWeight} ${dayFontSize}px ${fontFamily}`;
    const addrFont = `${fontStyle}${fontWeight} ${addrFontSize}px ${fontFamily}`;
    const logoFont = `${logoFontStyle}${logoFontWeight} ${logoFontSize}px ${fontFamily}`;
    const subFont = `${fontStyle}${fontWeight} ${subFontSize}px ${fontFamily}`;
    const noteFont = `${fontStyle}${fontWeight} ${noteFontSize}px ${fontFamily}`;

    const timeStr = `${currentTime.getHours().toString().padStart(2,'0')}:${currentTime.getMinutes().toString().padStart(2,'0')}`;
    const d = currentTime;
    const dateStr = `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()}`;
    const weekday = d.toLocaleDateString('vi-VN', { weekday: 'long' });
    const dayStr = weekday;

    let addrRaw = document.getElementById('address').value.trim() || "Không có địa chỉ";
    let addrLines = addrRaw.split('\n').map(s => s.trim()).filter(s => s);
    if (addrLines.length > 2) {
        addrLines = addrLines.slice(0, 2);
        addrLines[1] = addrLines[1] + '...';
    }
    if (addrLines.length === 0) addrLines = [""];
    else if (addrLines.length === 1) addrLines = [addrLines[0], ""];

    const ascentRatio = 0.8;
    const descentRatio = 0.2;
    const timeAscent = timeFontSize * ascentRatio;
    const timeDescent = timeFontSize * descentRatio;
    const dateAscent = dateFontSize * ascentRatio;
    const dayDescent = dayFontSize * descentRatio;

    const bottomPadding = 24 * scale;
    if (leftBlockY === 0) {
        leftBlockY = canvas.height - bottomPadding - timeFontSize - 150 * scale;
    }
    leftBlockY = Math.min(Math.max(leftBlockY, 10*scale), canvas.height - 200*scale);

    const timeY = leftBlockY + timeAscent;
    const dateY = leftBlockY + dateAscent;
    const dayY = leftBlockY + timeFontSize - dayDescent;

    ctx.font = timeFont;
    const timeWidth = ctx.measureText(timeStr).width;

    const barMargin = 12 * scale;
    const barWidth = barWidthVal * scale;
    const barX = leftBlockX + timeWidth + barMargin;
    const barY = leftBlockY;
    const barHeight = timeFontSize * barHeightFactor;
    const rightColX = barX + barWidth + barMargin;

    // Shadow
    ctx.shadowColor = `rgba(0,0,0,${shadowOpacity})`;
    ctx.shadowBlur = shadowBlur;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;

    function setFillStyleWithOpacity(hex, opacity) {
        let r = parseInt(hex.substring(1,3), 16);
        let g = parseInt(hex.substring(3,5), 16);
        let b = parseInt(hex.substring(5,7), 16);
        return `rgba(${r},${g},${b},${opacity})`;
    }

    ctx.textBaseline = 'alphabetic';

    // Giờ
    ctx.font = timeFont;
    ctx.fillStyle = setFillStyleWithOpacity(timeColor, textOpacity);
    ctx.fillText(timeStr, leftBlockX, timeY);

    // Vạch vàng
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = barColor;
    ctx.fillRect(barX, barY, barWidth, barHeight);
    ctx.shadowColor = `rgba(0,0,0,${shadowOpacity})`;

    // Ngày
    ctx.font = dateFont;
    ctx.fillStyle = setFillStyleWithOpacity(dateColor, textOpacity);
    ctx.fillText(dateStr, rightColX, dateY);

    // Thứ
    ctx.font = dayFont;
    ctx.fillStyle = setFillStyleWithOpacity(dayColor, textOpacity * 0.9);
    ctx.fillText(dayStr, rightColX, dayY);

    // Địa chỉ
    const addrY1 = dayY + dayDescent + addrMarginTop;
    ctx.font = addrFont;
    ctx.fillStyle = setFillStyleWithOpacity(addrColor, textOpacity * 0.85);
    ctx.fillText(addrLines[0], leftBlockX, addrY1);
    if (addrLines[1]) {
        const addrY2 = addrY1 + addrFontSize + 4 * scale;
        ctx.fillText(addrLines[1], leftBlockX, addrY2);
    }

    // ===== LOGO TEXT (mặc định Timemark) =====
    if (customLogo) {
        const logoX = canvas.width - 24 * scale;
        const logoYBase = canvas.height - 24 * scale;
        const logoY = logoYBase - subFontSize * 1.2 - 4*scale;
        ctx.font = logoFont;
        ctx.textAlign = 'right';
        const lowerLogo = customLogo.toLowerCase();
        if (lowerLogo.startsWith('time')) {
            const timePart = customLogo.substring(0, 4);
            const markPart = customLogo.substring(4);
            // Đo chiều rộng của cả hai phần
            const markWidth = ctx.measureText(markPart).width;
            let col1 = logoColor1, col2 = logoColor2;
            if (swapLogo) [col1, col2] = [col2, col1];
            // Vẽ "mark" sát lề phải (logoX)
            ctx.fillStyle = setFillStyleWithOpacity(col2, textOpacity);
            ctx.fillText(markPart, logoX, logoY);
            // Vẽ "Time" ngay bên trái "mark"
            ctx.fillStyle = setFillStyleWithOpacity(col1, textOpacity);
            ctx.fillText(timePart, logoX - markWidth, logoY);
        } else {
            ctx.fillStyle = setFillStyleWithOpacity(logoColor1, textOpacity);
            ctx.fillText(customLogo, logoX, logoY);
        }
        // Subtext
        ctx.font = subFont;
        ctx.fillStyle = setFillStyleWithOpacity(subColor, textOpacity * 0.8);
        ctx.fillText('100% Chân thực', logoX, logoYBase);
        ctx.textAlign = 'left';
    }

    // GPS
    if (gpsText) {
        ctx.font = `400 ${20 * scale}px ${fontFamily}`;
        ctx.fillStyle = setFillStyleWithOpacity('#A0D8FF', textOpacity);
        ctx.fillText(gpsText, leftBlockX, canvas.height - 10*scale);
    }

    // ===== GHI CHÚ DỌC BÊN PHẢI (có icon khiên và dấu tích) =====
    if (verticalNote) {
        const iconText = '🛡️✓ '; // icon khiên + dấu tích + khoảng trắng
        const fullText = iconText + verticalNote;

        ctx.save();
        ctx.font = noteFont;
        ctx.fillStyle = setFillStyleWithOpacity('#FFFFFF', textOpacity * 0.85);
        ctx.shadowColor = `rgba(0,0,0,${shadowOpacity})`;
        ctx.shadowBlur = shadowBlur;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;

        // Đặt vị trí: sát cạnh phải, giữa theo chiều dọc
        const centerX = canvas.width - notePadding;
        const centerY = canvas.height / 2;

        ctx.translate(centerX, centerY);
        ctx.rotate(-90 * Math.PI / 180); // xoay -90 độ để chữ đọc xuôi (từ trên xuống)
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(fullText, 0, 0);
        ctx.restore();
    }

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;

    document.getElementById('status').innerHTML = `Vị trí khối trái: (${Math.round(leftBlockX)}, ${Math.round(leftBlockY)}) | Kéo thả để di chuyển.`;
}

// Kéo thả
function handleDragStart(e) {
    e.preventDefault();
    if (!isLoaded) return;
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX ?? (e.touches ? e.touches[0].clientX : 0);
    const clientY = e.clientY ?? (e.touches ? e.touches[0].clientY : 0);
    const mouseX = (clientX - rect.left) * (canvas.width / rect.width);
    const mouseY = (clientY - rect.top) * (canvas.height / rect.height);
    dragging = true;
    dragOffsetX = mouseX - leftBlockX;
    dragOffsetY = mouseY - leftBlockY;
    canvas.style.cursor = 'grabbing';
}

function handleDragMove(e) {
    if (!dragging || !isLoaded) return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX ?? (e.touches ? e.touches[0].clientX : 0);
    const clientY = e.clientY ?? (e.touches ? e.touches[0].clientY : 0);
    const mouseX = (clientX - rect.left) * (canvas.width / rect.width);
    const mouseY = (clientY - rect.top) * (canvas.height / rect.height);
    let newX = mouseX - dragOffsetX;
    let newY = mouseY - dragOffsetY;
    newX = Math.min(Math.max(newX, 10*scale), canvas.width - 200*scale);
    newY = Math.min(Math.max(newY, 10*scale), canvas.height - 200*scale);
    leftBlockX = newX;
    leftBlockY = newY;
    draw();
}

function handleDragEnd(e) {
    if (dragging) {
        dragging = false;
        canvas.style.cursor = 'grab';
    }
}

canvas.addEventListener('mousedown', handleDragStart);
canvas.addEventListener('mousemove', handleDragMove);
canvas.addEventListener('mouseup', handleDragEnd);
canvas.addEventListener('mouseleave', handleDragEnd);
canvas.addEventListener('touchstart', handleDragStart, { passive: false });
canvas.addEventListener('touchmove', handleDragMove, { passive: false });
canvas.addEventListener('touchend', handleDragEnd);
canvas.addEventListener('touchcancel', handleDragEnd);

window.downloadImage = function() {
    if (!isLoaded) {
        alert("Chưa có ảnh để tải!");
        return;
    }
    const link = document.createElement('a');
    link.download = 'ducthuat_' + new Date().getTime() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
};
